# Start the daemon inside the Hyprland session (uwsm), not at plain user login,
# so it inherits WAYLAND_DISPLAY & co. The empty WantedBy= clears the vendor's
# default.target before adding graphical-session.target.
[Unit]
PartOf=graphical-session.target
After=graphical-session.target

[Install]
WantedBy=
WantedBy=graphical-session.target
